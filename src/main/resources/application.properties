# ─────────────────────────────────────────────
#  Vehicle Telematics API — Application Config
# ─────────────────────────────────────────────

spring.application.name=vehicle-telematics-api

# ── LOCAL DEV: uses H2 in-memory database ──
# Switch to postgres profile for production
spring.datasource.url=jdbc:h2:mem:telematicsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JPA / Hibernate ──
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── JWT Config ──
# In production, move this to an environment variable / AWS Secrets Manager
app.jwt.secret=YourSuperSecretKeyForFordTelematicsAPI2024ChangeInProduction
app.jwt.expiration-ms=86400000

# ── Server ──
server.port=8080

# ── Logging ──
logging.level.com.ford.telematics=DEBUG
logging.level.org.springframework.security=INFO
